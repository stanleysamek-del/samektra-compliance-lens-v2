allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security fixes in transitive packages. UUID 11 retains ExcelJS's CJS v4 API.
overrides:
  'tmp@<0.2.7': '0.2.7'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  'brace-expansion@<2': '1.1.18'
  'brace-expansion@>=2 <3': '2.1.4'
  'browserslist@<4.28.7': '4.28.7'
  'baseline-browser-mapping@<2.11.0': '2.11.0'
  '@babel/core@<7.29.6': '7.29.6'
  'exceljs>uuid': '11.1.1'
